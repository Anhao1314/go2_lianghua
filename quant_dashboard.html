<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>go2w-quant 量化决策看板</title>
<style>
:root{
  --bg:#0a0e14; --panel:#10151d; --border:#1e2633; --text:#c9d1d9; --muted:#8b949e;
  --green:#7bd88f; --red:#ff7b72; --yellow:#f2cc60; --cyan:#79c0ff; --gold:#f7c948;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);
  font-family:'Cascadia Mono','Consolas','Microsoft YaHei UI','Microsoft YaHei',monospace;
  font-size:13px;line-height:1.5}
body{min-width:1200px;padding:10px 14px 20px}
.muted{color:var(--muted)}
.ok{color:var(--green)}
.bad{color:var(--red)}
.warn{color:var(--yellow)}
.cyan{color:var(--cyan)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.panel h2{font-size:12px;color:var(--cyan);letter-spacing:2px;border-bottom:1px solid var(--border);
  padding-bottom:6px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.panel h2 .hint{color:var(--muted);font-weight:400;letter-spacing:0;font-size:11px;margin-left:auto}
/* 顶部决策摘要栏 */
.topbar{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 4px}
.stat{flex:1 1 140px;padding:6px 12px;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat .k{font-size:10px;color:var(--muted);letter-spacing:1px}
.stat .v{font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:10px;color:var(--muted);font-variant-numeric:normal}
/* 三栏布局 */
.layout{display:flex;gap:12px;margin-top:12px;align-items:flex-start}
.col-left{flex:0 0 calc(30% - 8px);min-width:0}
.col-mid{flex:0 0 calc(45% - 8px);min-width:0}
.col-right{flex:1 1 calc(25% - 8px);min-width:0}
/* 赔率表 */
table.odds{width:100%;border-collapse:collapse;font-size:12px}
table.odds th{text-align:left;color:var(--muted);font-weight:400;border-bottom:1px solid var(--border);
  padding:4px 6px;cursor:pointer;white-space:nowrap;user-select:none}
table.odds th:hover{color:var(--cyan)}
table.odds th.sorted{color:var(--cyan)}
table.odds td{padding:4px 6px;border-bottom:1px solid rgba(30,38,51,.55);white-space:nowrap}
table.odds tr[data-chart]{cursor:pointer}
table.odds tr[data-chart]:hover td{background:rgba(121,192,255,.06)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge-contrib{font-size:11px;padding:0 4px;border-radius:3px;white-space:nowrap}
.ic{color:var(--green)} .io{color:var(--yellow)} .is{color:var(--muted)}
.note{font-size:11px;color:var(--muted)}
/* 冗余关系 */
.red-line{padding:4px 0;border-bottom:1px dashed rgba(30,38,51,.6);font-size:12px}
/* 风险卡片 */
.card{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:10px;cursor:pointer;
  background:linear-gradient(180deg,rgba(16,21,29,.7),rgba(16,21,29,.25))}
.card:hover{border-color:#2b3a52}
.card .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .title{font-size:13px;font-weight:600}
.card .src-badge{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:3px;padding:0 4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}
.dot-r3{--glow:rgba(255,123,114,.8);background:var(--red);animation:breathe 1.4s ease-in-out infinite}
.dot-r2{--glow:rgba(242,204,96,.8);background:var(--yellow);animation:breathe 2s ease-in-out infinite}
.dot-r1{background:var(--yellow);opacity:.75}
.dot-r0{background:var(--green)}
@keyframes breathe{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--glow)}50%{opacity:.45;box-shadow:0 0 10px 3px var(--glow)}}
.progress{height:6px;background:#1a2230;border-radius:3px;margin:6px 0;overflow:hidden}
.progress>div{height:100%;border-radius:3px;background:var(--cyan)}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(30,38,51,.5);padding:2px 0;font-size:12px}
.kv .k{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
.rule-tag{display:inline-block;font-size:11px;padding:1px 6px;margin:2px 4px 2px 0;
  background:rgba(255,123,114,.12);color:var(--red);border:1px solid rgba(255,123,114,.45);border-radius:3px}
.decision{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;margin-top:6px}
.decision.continue{color:var(--green);background:rgba(123,216,143,.1);border:1px solid rgba(123,216,143,.45)}
.decision.tune{color:var(--yellow);background:rgba(242,204,96,.1);border:1px solid rgba(242,204,96,.45)}
.decision.stop{color:var(--red);background:rgba(255,123,114,.1);border:1px solid rgba(255,123,114,.45)}
.save{font-size:11px;color:var(--green);margin-top:4px}
.reason{font-size:11px;color:var(--muted);margin-top:6px;border-left:2px solid var(--border);padding-left:8px}
/* 图表 */
.chart-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chart-head select{background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;
  font-family:inherit;font-size:12px;padding:2px 6px}
svg text{font-family:'Cascadia Mono','Consolas','Microsoft YaHei UI',monospace}
svg circle{cursor:crosshair}
.caption{font-size:11px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--border);padding-top:6px;line-height:1.6}
.placeholder{color:var(--muted);font-size:12px;padding:30px 10px;text-align:center;
  border:1px dashed var(--border);border-radius:6px;line-height:1.8}
/* 右栏 */
.qrow{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:5px 0;border-bottom:1px dashed rgba(30,38,51,.5)}
.qrow .qk{color:var(--muted);flex:0 0 88px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.bar-row .bl{flex:0 0 64px;color:var(--muted)}
.bar{flex:1;height:14px;background:#1a2230;border-radius:3px;overflow:hidden}
.bar>div{height:100%;border-radius:3px}
.bar-row .bn{flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums}
.arch{font-size:11px;color:var(--muted);white-space:pre;overflow-x:auto;line-height:1.45}
.check{font-size:12px;padding:3px 0}
/* 时间线 */
.timeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.tl{flex:1 1 0;min-width:172px;background:var(--panel);border:1px solid var(--border);
  border-left:3px solid var(--cyan);border-radius:4px;padding:8px 10px;font-size:11px}
.tl .tld{color:var(--cyan)}
.tl .tlt{color:var(--muted);margin-top:3px;line-height:1.4}
/* 悬停提示 */
#tooltip{position:fixed;z-index:99;display:none;background:#0d1117;border:1px solid var(--cyan);
  border-radius:4px;padding:4px 8px;font-size:11px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.5)}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="layout">
  <section class="col-left">
    <div class="panel">
      <h2>规则体系 · 赔率表<span class="hint">点击表头排序 · 点击行切换曲线</span></h2>
      <table class="odds">
        <thead id="oddsHead"></thead>
        <tbody id="oddsBody"></tbody>
      </table>
      <div class="note" id="oddsWarn" style="margin-top:6px"></div>
    </div>
    <div class="panel">
      <h2>冗余关系图<span class="hint">小样本下保留冗余，pass≥5 且 stop≥20 后精简</span></h2>
      <div id="redundancy"></div>
    </div>
  </section>
  <section class="col-mid">
    <div class="panel">
      <h2>训练中 run 风险卡片<span class="hint">点击卡片切换曲线</span></h2>
      <div id="cards"></div>
    </div>
    <div class="panel">
      <h2>奖励曲线<span class="hint">悬停数据点查看详情</span></h2>
      <div class="chart-head">
        <select id="chartSelect"></select>
        <span class="muted" id="chartTitle"></span>
      </div>
      <div id="chartSvg"></div>
      <div class="caption" id="chartCaption"></div>
    </div>
  </section>
  <section class="col-right">
    <div class="panel">
      <h2>回测净值 · 累计节省<span class="hint">11 个首停事件</span></h2>
      <div id="savingsSvg"></div>
      <div class="note" id="savingsNote" style="margin-top:6px"></div>
    </div>
    <div class="panel">
      <h2>标签分布<span class="hint">31 runs</span></h2>
      <div id="labelBars"></div>
      <div class="warn" id="labelWarn" style="font-size:11px;margin-top:6px;line-height:1.6"></div>
    </div>
    <div class="panel">
      <h2>数据质量指标</h2>
      <div id="quality"></div>
    </div>
    <div class="panel">
      <h2>数据分层架构</h2>
      <pre class="arch" id="arch"></pre>
    </div>
    <div class="panel">
      <h2>待验证 checklist</h2>
      <div id="checklist"></div>
    </div>
  </section>
</main>
<footer class="panel">
  <h2>实验记录时间线</h2>
  <div class="timeline" id="timeline"></div>
</footer>
<div id="tooltip"></div><script>

  ]
};/* ============ 渲染 ============ */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fmt(n) { return Math.round(n).toLocaleString(); }

function renderTopbar() {
  const m = DASH.meta;
  document.getElementById('topbar').innerHTML =
    '<div class="stat"><div class="k">规则体系</div><div class="v">' + m.rules.total +
      '<small> 总规则</small> · <span class="ok">独立 ' + m.rules.independent + '</span> · <span class="muted">冗余 ' + m.rules.redundant + '</span></div></div>' +
    '<div class="stat"><div class="k">当前建议</div><div class="v"><span class="bad">早停 ' + m.advice.stop + '</span> · <span class="warn">调参 ' + m.advice.tune + '</span> · <span class="ok">继续 ' + m.advice.cont + '</span></div></div>' +
    '<div class="stat"><div class="k">累计回测节省</div><div class="v">' + fmt(Math.floor(m.savedMinutes / 1000) * 1000) + '+<small> min（10 个实际口径首停）</small></div></div>' +
    '<div class="stat"><div class="k">样本外验证</div><div class="v">' + m.oos.passed + '/' + m.oos.total + '<small> 通过（' + m.oos.note + '）</small></div></div>' +

    '<div class="stat"><div class="k">数据一致性</div><div class="v ok">' + m.consistency.factors + '/' + m.consistency.factors + ' 因子<small> × ' + m.consistency.sections + '/80 截面通过</small></div></div>' +
    '<div class="stat"><div class="k">泄漏检测</div><div class="v ok">已修复<small> Config A LOO</small></div></div>' +
    '<div class="stat"><div class="k">数据分层</div><div class="v">' + m.layering + '</div></div>' +
    '<div class="stat"><div class="k">系统状态</div><div class="v warn">' + m.system.label + '</div></div>';
}

/* 赔率表排序 */
let oddsSort = { key: 'order', dir: 1 };
const ODDS_COLS = [
  { k: 'factor', label: '规则', t: 'text' },
  { k: 'contrib', label: '独立贡献', t: 'text' },
  { k: 'trigger', label: '触发', t: 'num' },
  { k: 'fail', label: 'fail', t: 'num' },
  { k: 'unknown', label: 'unknown', t: 'num' },
  { k: 'pass', label: '误杀(pass)', t: 'num' },
  { k: 'hit', label: '命中率', t: 'num' },
  { k: 'net', label: '净节省(min)', t: 'num' },
  { k: 'oos', label: '样本外', t: 'text' }
];
function renderOdds() {
  const rows = DASH.odds.map((r, i) => Object.assign({}, r, { order: i }));
  rows.sort((a, b) => {
    const k = oddsSort.key, d = oddsSort.dir;
    if (k === 'order') return d * (a.order - b.order);
    if (k === 'factor' || k === 'oos') return d * a[k].localeCompare(b[k]);
    if (k === 'contrib') return d * (a.cls.localeCompare(b.cls) || a.order - b.order);
    return d * (a[k] - b[k]);
  });
  const arrow = oddsSort.dir === 1 ? ' ▲' : ' ▼';
  document.getElementById('oddsHead').innerHTML = '<tr>' + ODDS_COLS.map(c =>
    '<th data-k="' + c.k + '" class="' + (oddsSort.key === c.k ? 'sorted' : '') + '">' + c.label + (oddsSort.key === c.k ? arrow : '') + '</th>'
  ).join('') + '</tr>';
  document.getElementById('oddsBody').innerHTML = rows.map(r =>
    '<tr data-chart="' + r.chart + '"><td>' + r.factor + '</td>' +
    '<td><span class="badge-contrib ' + r.cls + '">' + r.contrib + '</span></td>' +
    '<td class="num">' + r.trigger + '</td><td class="num">' + r.fail + '</td>' +
    '<td class="num">' + r.unknown + '</td><td class="num">' + r.pass + '</td>' +
    '<td class="num">' + r.hit + '</td><td class="num">' + r.net + '</td><td>' + r.oos + '</td></tr>'
  ).join('');
  document.getElementById('oddsWarn').innerHTML =
    '⚠️ pass=' + DASH.meta.totals.pass + '，误杀率 N/A；命中率 100% 仅表示「0 误杀」，样本量不足以评估安全性。';
}

function renderCards() {

      '<div class="kv"><span class="k">当前奖励</span><b>' + c.cur + '</b></div>' +
      '<div class="kv"><span class="k">峰值奖励</span><b>' + c.peak + '</b></div>' +
      '<div class="kv"><span class="k">回撤</span><b>' + c.dd + '</b></div>' +
      '<div style="margin-top:4px">' + tags + '</div>' +
      '<span class="decision ' + c.decision + '">' + c.decisionText + '</span>' + save +
      '<div class="reason">' + c.reason + '</div></div>';
  }).join('');
}

/* 奖励曲线（手写 SVG） */
let curKey = 'balance';
const chartSelect = document.getElementById('chartSelect');
function renderChart() {
  const c = DASH.curves[curKey];
  document.getElementById('chartTitle').textContent = c.label;
  if (c.placeholder) {
    document.getElementById('chartSvg').innerHTML = '<div class="placeholder">' + c.caption + '</div>';
    document.getElementById('chartCaption').innerHTML = '';
    return;
  }
  const W = 760, H = 320, P = { l: 46, r: 14, t: 20, b: 30 };
  const xMax = c.xMax, yMin = c.yMin, yMax = c.yMax;
  const X = v => P.l + (v / xMax) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - yMin) / (yMax - yMin)) * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (yMax - yMin) * i / 4, y = Y(v);
    g += '<line x1="' + P.l + '" y1="' + y + '" x2="' + (W - P.r) + '" y2="' + y + '" stroke="#1e2633" stroke-width="1"/>';
    g += '<text x="' + (P.l - 6) + '" y="' + (y + 4) + '" fill="#8b949e" font-size="10" text-anchor="end">' + v + '</text>';
  }
  for (let i = 0; i <= 4; i++) {
    const v = xMax * i / 4, x = X(v);
    g += '<line x1="' + x + '" y1="' + P.t + '" x2="' + x + '" y2="' + (H - P.b) + '" stroke="#1a2230" stroke-width="1"/>';
    g += '<text x="' + x + '" y="' + (H - P.b + 14) + '" fill="#8b949e" font-size="10" text-anchor="middle">' + v.toFixed(1) + 'M</text>';
  }
  const pts = c.points;
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('');
  /* 回撤填充：峰值点之后到末尾 */
  if (c.peak) {
    let poly = 'M' + X(c.peak.x).toFixed(1) + ',' + Y(c.peak.y).toFixed(1) + ' ' +
      pts.filter(p => p[0] >= c.peak.x).map(p => 'L' + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ') +
      ' L' + X(xMax).toFixed(1) + ',' + Y(c.peak.y).toFixed(1) + ' Z';
    g += '<path d="' + poly + '" fill="rgba(255,123,114,.10)" stroke="none"/>';
  }
  g += '<path d="' + line + '" fill="none" stroke="#79c0ff" stroke-width="1.8"/>';
  /* early_low_reward 25% 窗口黄虚线 */
  if (c.early25 !== null) {
    const x = X(c.early25);
    g += '<line x1="' + x + '" y1="' + P.t + '" x2="' + x + '" y2="' + (H - P.b) + '" stroke="#f2cc60" stroke-width="1" stroke-dasharray="4,3"/>';
    g += '<text x="' + (x + 3) + '" y="' + (P.t + 10) + '" fill="#f2cc60" font-size="9">early_low 25%</text>';
  }
  /* 峰值阻力位 + 金星 */
  if (c.peak) {
    const py = Y(c.peak.y), px = X(c.peak.x);
    g += '<line x1="' + P.l + '" y1="' + py + '" x2="' + (W - P.r) + '" y2="' + py + '" stroke="#7bd88f" stroke-width="1" stroke-dasharray="5,3"/>';
    g += '<path d="M' + px + ',' + (py - 5) + ' L' + (px + 5) + ',' + py + ' L' + px + ',' + (py + 5) + ' L' + (px - 5) + ',' + py + ' Z" fill="#f7c948" stroke="#0a0e14" stroke-width="1"/>';
    g += '<text x="' + (px + 8) + '" y="' + (py + 3) + '" fill="#7bd88f" font-size="9">峰值 ' + c.peak.y + '</text>';
  }
  /* 首停红三角 */
  if (c.firstStop !== null) {
    const x = X(c.firstStop);
    g += '<path d="M' + x + ',' + (P.t + 2) + ' L' + (x - 5) + ',' + (P.t + 14) + ' L' + (x + 5) + ',' + (P.t + 14) + ' Z" fill="#ff7b72"/>';
    g += '<text x="' + (x + 8) + '" y="' + (P.t + 12) + '" fill="#ff7b72" font-size="9">首停 ' + c.firstStop + 'M</text>';
  }
  if (c.oos) {
    g += '<text x="' + (W - P.r - 2) + '" y="' + (P.t + 24) + '" fill="#7bd88f" font-size="10" text-anchor="end">★ ' + c.oos + '</text>';
  }
  pts.forEach(p => {
    g += '<circle cx="' + X(p[0]).toFixed(1) + '" cy="' + Y(p[1]).toFixed(1) + '" r="3" fill="#79c0ff" stroke="#0a0e14" stroke-width="1" data-tip="t=' + p[0] + 'M, reward=' + p[1] + '"/>';
  });
  document.getElementById('chartSvg').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">' + g + '</svg>';
  document.getElementById('chartCaption').innerHTML = c.caption;
}

/* 回测累计节省净值曲线 */
function renderSavings() {
  const S = DASH.savings;
  const pts = [];
  let cum = 0;
  S.events.forEach(e => { if (e.save === null) { pts.push(null); } else { cum += e.save; pts.push(cum); } });
  const W = 760, H = 260, P = { l: 48, r: 14, t: 18, b: 26 };
  const maxCum = Math.max.apply(null, pts.filter(p => p !== null));
  const X = i => P.l + (i / (S.events.length - 1)) * (W - P.l - P.r);
  const Y = v => P.t + (1 - v / maxCum) * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = maxCum * i / 4, y = Y(v);
    g += '<line x1="' + P.l + '" y1="' + y + '" x2="' + (W - P.r) + '" y2="' + y + '" stroke="#1e2633" stroke-width="1"/>';
    g += '<text x="' + (P.l - 6) + '" y="' + (y + 4) + '" fill="#8b949e" font-size="10" text-anchor="end">' + fmt(v) + '</text>';
  }
  for (let i = 0; i < S.events.length; i++) {
    const x = X(i);
    g += '<line x1="' + x + '" y1="' + P.t + '" x2="' + x + '" y2="' + (H - P.b) + '" stroke="#1a2230" stroke-width="1"/>';
  }
  /* 折线（null 处断开） */
  let d = '', started = false;
  pts.forEach((p, i) => {
    if (p === null) { started = false; return; }
    d += (started ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p).toFixed(1) + ' ';
    started = true;
  });
  g += '<path d="' + d + '" fill="none" stroke="#7bd88f" stroke-width="2"/>';
  /* 事件标记 */
  S.events.forEach((e, i) => {
    if (e.save === null) {
      g += '<text x="' + X(i) + '" y="' + (P.t + 14) + '" fill="#ff7b72" font-size="9" text-anchor="middle">✕ 剔除</text>';
      return;
    }
    const x = X(i), y = Y(pts[i]);
    g += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="#7bd88f" stroke="#0a0e14" stroke-width="1" data-tip="' + e.name + ': +' + e.save + ' min, 累计 ' + fmt(pts[i]) + '"/>';
    if (e.mark) {
      g += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="7" fill="none" stroke="#f7c948" stroke-width="1.5"/>';
      g += '<text x="' + x + '" y="' + (y - 8) + '" fill="#f7c948" font-size="9" text-anchor="middle">' + e.mark + '</text>';
      g += '<text x="' + x + '" y="' + (H - P.b + 12) + '" fill="#8b949e" font-size="9" text-anchor="middle">' + e.name + '</text>';
    }
  });
  document.getElementById('savingsSvg').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">' + g + '</svg>';
  document.getElementById('savingsNote').innerHTML =
    '累计 ≈ ' + fmt(S.total) + ' min（11 个首停事件中 10 个实际口径；' + S.excludedNote;
}

function renderLabels() {
  const L = DASH.labels, mx = Math.max(L.pass, L.fail, L.unknown);
  const bar = (label, color, val) =>
    '<div class="bar-row"><span class="bl">' + label + '</span>' +
    '<div class="bar"><div style="width:' + (val / mx * 100).toFixed(0) + '%;background:' + color + '"></div></div>' +
    '<span class="bn" style="color:' + color + '">' + val + '</span></div>';
  document.getElementById('labelBars').innerHTML =
    bar('pass', '#7bd88f', L.pass) + bar('fail', '#ff7b72', L.fail) + bar('unknown', '#f2cc60', L.unknown);
  document.getElementById('labelWarn').textContent =
    '⚠️ pass=2，误杀率无法计算。建议 pass≥5 后再评估规则安全性，pass≥20 后考虑监督模型。';
}

/* ============ 交互 ============ */
/* 悬停 tooltip（SVG data-tip） */
const tipEl = document.getElementById('tooltip');
document.addEventListener('mousemove', e => {
  const t = e.target;
  const tip = t && t.getAttribute ? t.getAttribute('data-tip') : null;
  if (tip) {
    tipEl.style.display = 'block';
    tipEl.style.left = (e.clientX + 12) + 'px';
    tipEl.style.top = (e.clientY + 10) + 'px';
    tipEl.textContent = tip;
  } else {
    tipEl.style.display = 'none';
  }
});

/* 赔率表排序 */
document.getElementById('oddsHead').addEventListener('click', e => {
  const th = e.target.closest('th[data-k]');
  if (!th) return;
  const k = th.dataset.k;
  if (oddsSort.key === k) { oddsSort.dir *= -1; } else { oddsSort = { key: k, dir: 1 }; }
  renderOdds();
});

/* 点击赔率行 → 切换中部曲线 */
document.getElementById('oddsBody').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-chart]');
  if (!tr) return;
  curKey = tr.dataset.chart;
  chartSelect.value = curKey;
  renderChart();
});

/* 点击风险卡片 → 切换曲线 */
document.getElementById('cards').addEventListener('click', e => {
  const card = e.target.closest('.card[data-curve]');
  if (!card) return;
  curKey = card.dataset.curve;
  chartSelect.value = curKey;
  renderChart();
});

/* 下拉切换 run */
chartSelect.addEventListener('change', () => {
  curKey = chartSelect.value;
  renderChart();
});

/* ============ 初始化 ============ */
(function init() {
  chartSelect.innerHTML = Object.keys(DASH.curves).map(k =>
    '<option value="' + k + '">' + DASH.curves[k].label + '</option>'
  ).join('');
  renderTopbar();
  renderOdds();
  renderRedundancy();
  renderCards();
  renderChart();
  renderSavings();
  renderLabels();
  renderQuality();
  renderArch();
  renderChecklist();
  renderTimeline();
})();
</script>
